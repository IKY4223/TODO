name: Game data

# A new game version adds characters, gear and sets that the vendored game data lacks.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays
  workflow_dispatch:

jobs:
  fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python scripts/sync_gamedata.py
        working-directory: backend
      - run: uv run python scripts/sync_starrail_data.py
        working-directory: backend
      - name: gamedata.json matches the current game version
        run: |
          git diff --exit-code --stat && exit 0
          echo "::error::Game data is out of date. Run the sync scripts in backend/scripts and open a pull request."
          exit 1
