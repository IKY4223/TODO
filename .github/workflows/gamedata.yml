name: Game data

# A new game version adds characters, gear and sets that the vendored game data lacks. Every day
# this syncs the data from Enka.Network and StarRailRes; when it changed, it runs every check and
# opens (or updates) a pull request for the owner to merge, red when a check failed.
on:
  schedule:
    - cron: "17 5 * * *" # daily: a game version lands in the sources within a day or two
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: gamedata

env:
  BRANCH: game-data
  UV_LOCKED: 1

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python scripts/sync_gamedata.py
        working-directory: backend
      - run: uv run python scripts/sync_starrail_data.py
        working-directory: backend
      - name: Anything new?
        id: diff
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git diff --stat

      # A pull request opened with this workflow's token does not start CI, so the checks run here.
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.diff.outputs.changed == 'true'
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - if: steps.diff.outputs.changed == 'true'
        id: check
        continue-on-error: true
        run: ./check.sh

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Sync game data from Enka.Network and StarRailRes"
          git push --force origin "$BRANCH"
          if [ "$OUTCOME" = success ]; then
            result="Every check passed. Merge when ready."
          else
            result="A check failed: see $RUN. The data format may have changed; the code needs a fix before this merges."
          fi
          body="New game data from Enka.Network and StarRailRes. $result"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Game data update" --body "$body"
          fi
      - name: Fail the run when a check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
