name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: 1 # fail instead of silently updating a stale uv.lock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ./check.sh
      - name: Generated API types are committed
        run: git diff --exit-code

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
