name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: 1 # fail instead of silently updating a stale uv.lock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: ./check.sh
      - name: Generated API types are committed
        run: git diff --exit-code

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hoyo-toolkit .
      - name: The image serves the API and the frontend
        run: |
          docker run -d -p 8000:8000 hoyo-toolkit
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8000/api/health
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
