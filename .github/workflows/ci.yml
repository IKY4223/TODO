name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: 1 # fail instead of silently updating a stale uv.lock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: ./check.sh
      - name: Generated API types are committed
        run: git diff --exit-code

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hoyo-toolkit .
      - name: The image serves the API and the frontend
        run: |
          docker run -d -p 8000:8000 hoyo-toolkit
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8000/api/health
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
      - name: The image listens on the host's PORT and can ask for a password
        run: |
          docker run -d -p 9000:9000 -e PORT=9000 -e SITE_PASSWORD=ci-only hoyo-toolkit
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://localhost:9000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/)" = 401
          curl -fsS -u anyone:ci-only http://localhost:9000/ | grep -q '<div id="root">'

  link-scripts:
    # The PC scripts that find a history link, run against a made-up game in both PowerShells
    # a player may have.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./frontend/src/wishes/link-scripts/test.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./frontend/src/wishes/link-scripts/test.ps1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: No known vulnerability in the Python dependencies
        working-directory: backend
        run: uv export --frozen --no-hashes > "$RUNNER_TEMP/requirements.txt" && uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - name: No known vulnerability in the npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
