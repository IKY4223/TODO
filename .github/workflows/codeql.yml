name: CodeQL

# GitHub's code scanning: finds injection, unsafe data flows and the like in the Python and
# TypeScript code and in these workflows. Results appear under the repository's Security tab.
on:
  push:
  schedule:
    - cron: "17 3 * * 1" # weekly, for queries GitHub adds

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
